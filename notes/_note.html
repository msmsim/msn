<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base target="_blank">
    <title>{{slug}} | Matthew McDowell-Sweet</title>
    <meta name="description" content="{{description}}">
    <link rel="icon" href="/msn-fav.png" type="image/png" alt="msweet.net's logo">
    <meta property="og:title" content="{{slug}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:image" content="https://www.msweet.net/msn-ogi.png">
    <meta property="og:url" content="{{url}}">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="msweet.net">
    <meta property="article:published_time" content="{{datetime_iso}}">
    <link rel="canonical" href="{{url}}">
    <link rel="stylesheet" href="/notes/note.css">
    <script defer data-goatcounter="https://msweet.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<nav class="back"><a href="{{index_path}}" target="_self">← notes</a></nav>
<main>
{{content}}
</main>
<p class="stamp"><a href="{{path}}" target="_self"><time datetime="{{datetime_iso}}">{{datetime}}</time></a></p>
<nav class="adjacent">
<!-- if:prev -->
<a rel="prev" href="{{prev_path}}" target="_self">← previous</a>
<!-- /if:prev -->
<!-- if:next -->
<a rel="next" href="{{next_path}}" target="_self">next →</a>
<!-- /if:next -->
</nav>
</body>
</html>
