<main>
<p>The simplest possible test of aptitude for entrepreneurship? $200 and 40 hours across a month. The thesis being that if intelligence-on-tap isn’t enough to generate &gt;$200 of value for someone, somewhere, then <em>more</em> resource and <em>more</em> time likely won’t, either.</p>
