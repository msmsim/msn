name: Build notes stream

# The stream index and the prev/next links are derived from the note pages in
# notes/, so any publisher — motes, Subset's HTTP peer receiver, a hand-edited
# file — only has to drop its own page and this rebuilds the rest.
#
# Pushes made with GITHUB_TOKEN do not trigger workflows, so this cannot loop on
# its own commit; the index.html exclusion below is belt and braces.

on:
  push:
    branches: [main]
    paths:
      - "notes/**.html"
      - "!notes/index.html"
      - "tools/build-stream.mjs"
  workflow_dispatch:

concurrency:
  # Two notes published close together would otherwise race on the same file.
  group: build-stream
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Rebuilds against whatever is on main right now, not against the commit
      # that triggered the run. A publisher that lands a second commit while
      # this is running — the receiver writes its share registry separately
      # from the page — would otherwise leave the push rejected and the stream
      # stale. The build is a pure function of the notes directory, so
      # restarting from the current head is always safe.
      - name: Build and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            node tools/build-stream.mjs

            if [ -z "$(git status --porcelain)" ]; then
              echo "already up to date"
              exit 0
            fi

            git add notes
            git commit -m "stream: rebuild index and adjacent links"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "push rejected on attempt $attempt; rebuilding against the new head"
          done

          echo "could not push after 3 attempts"
          exit 1
